name: CI

# Pushes to master are verified by the publish workflow, which runs the same
# checks before releasing — no need to run everything twice.
on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the supported floor, declared in package.json engines.
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts, which are an
      # arbitrary-code-execution path during install. Nothing in the tree needs
      # them: the only packages with install scripts are fsevents (macOS-only,
      # optional) and unrs-resolver (ships prebuilt per-platform binaries).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Verify the published package works
        run: |
          npm pack
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/ahmetilhn-memofy-*.tgz

          cat > esm.mjs <<'EOF'
          import Memofy from "@ahmetilhn/memofy";
          const memoized = new Memofy().memoize((n) => n * 2);
          if (memoized(2) !== 4) throw new Error("ESM entry is broken");
          console.log("ESM entry OK");
          EOF

          cat > cjs.cjs <<'EOF'
          const { Memofy } = require("@ahmetilhn/memofy");
          const memoized = new Memofy().memoize((n) => n * 2);
          if (memoized(2) !== 4) throw new Error("CJS entry is broken");
          console.log("CJS entry OK");
          EOF

          node esm.mjs
          node cjs.cjs
